services:
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      - mysql
      - redis

  nginx:
    build:
      context: ./docker/nginx
    ports:
      - "8080:80"
    restart: always
    depends_on:
      - php

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: hms
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  supervisor:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    command: /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf
    restart: always
    depends_on:
      - php
      - redis

volumes:
  mysql_data:
  redis_data:
